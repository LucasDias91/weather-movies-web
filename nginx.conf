server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000/api/;
  }

  location /swagger {
    proxy_pass http://api:8000/swagger;
  }

  location /openapi.json {
    proxy_pass http://api:8000/openapi.json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
