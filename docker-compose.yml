services:
  api:
    build:
      context: ../weather-movies-api
    ports:
      - "8000:8000"
    env_file:
      - path: ../weather-movies-api/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/weather_movies.db
    volumes:
      - api-data:/data

  web:
    build:
      context: .
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  api-data:
